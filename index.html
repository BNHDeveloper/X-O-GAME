<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X-O GAME</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game-container">
    <header class="game-header">
      <div class="logo-mark" aria-hidden="true">XO</div>
      <p class="eyebrow">THE CLASSIC GAME, REIMAGINED</p>
      <h1>XO <span>NEON</span></h1>
      <p class="subtitle">Two players. One board. One winner.</p>
    </header>

    <section class="scoreboard" aria-label="Game scores">
      <div class="score-card score-x">
        <span class="player-symbol">X</span>
        <span class="player-name">PLAYER X</span>
        <strong id="score-x">0</strong>
      </div>

      <div class="score-card score-draw">
        <span class="player-name">DRAWS</span>
        <strong id="score-draw">0</strong>
      </div>

      <div class="score-card score-o">
        <span class="player-symbol">O</span>
        <span class="player-name">PLAYER O</span>
        <strong id="score-o">0</strong>
      </div>
    </section>

    <section class="game-panel" aria-label="Tic-Tac-Toe board">
      <div class="turn-indicator" aria-live="polite">
        <span class="status-dot" id="status-dot"></span>
        <p id="game-status">Player X's turn</p>
      </div>

      <div class="game-board" id="game-board" role="group"
           aria-label="Nine-cell Tic-Tac-Toe board">
        <button class="cell" type="button" data-index="0" aria-label="Row 1, column 1"></button>
        <button class="cell" type="button" data-index="1" aria-label="Row 1, column 2"></button>
        <button class="cell" type="button" data-index="2" aria-label="Row 1, column 3"></button>
        <button class="cell" type="button" data-index="3" aria-label="Row 2, column 1"></button>
        <button class="cell" type="button" data-index="4" aria-label="Row 2, column 2"></button>
        <button class="cell" type="button" data-index="5" aria-label="Row 2, column 3"></button>
        <button class="cell" type="button" data-index="6" aria-label="Row 3, column 1"></button>
        <button class="cell" type="button" data-index="7" aria-label="Row 3, column 2"></button>
        <button class="cell" type="button" data-index="8" aria-label="Row 3, column 3"></button>
      </div>

      <div class="game-message" id="game-message" aria-live="polite">
        Make your move and claim the board.
      </div>

      <div class="game-controls">
        <button class="btn btn-primary" id="restart-btn" type="button">
          <span aria-hidden="true">↻</span> New Round
        </button>
        <button class="btn btn-secondary" id="reset-btn" type="button">
          Reset Scores
        </button>
      </div>
    </section>
  </main>
  <script src="./script.js"></script>
</body>
</html>
